<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tentacalendar 2.0 — Foundation Smoke Test</title>
<!-- ============================================================
     Tentacalendar 2.0 — smoke.html
     Version 1.0.0

     WHAT THIS IS: a throwaway page that proves the ENTIRE foundation
     works before a single line of the real app is written — config,
     Google sign-in, Firestore, the 2.0 rules, and GitHub Pages, all at
     once. If this page goes green, the next session can write code
     instead of debugging plumbing.

     It also walks the exact bootstrap sequence that the design doc's
     §5 rules DEADLOCKED on (user doc -> workspace -> first member doc),
     so it is the regression test for that fix.

     Test 6 is the important one: it proves the rules DENY. A foundation
     that only proves access works is half-tested.

     DELETE THIS FILE once the real app exists.
     ============================================================ -->
<style>
  body{font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;background:#14161a;color:#e8eaed;
       margin:0;padding:2rem 1.25rem;max-width:720px;margin-inline:auto}
  h1{font-size:1.35rem;margin:0 0 .25rem}
  .sub{color:#9aa0a6;margin:0 0 1.5rem;font-size:.9rem}
  button{font:inherit;background:#4dabf7;color:#08121c;border:0;border-radius:8px;
         padding:.7rem 1.2rem;cursor:pointer;font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  #out{margin-top:1.5rem}
  .row{padding:.55rem .75rem;border-radius:7px;margin-bottom:.4rem;background:#1d2026;
       display:flex;gap:.6rem;align-items:flex-start}
  .row .ico{flex:0 0 1.3rem}
  .pass{border-left:3px solid #69db7c}
  .fail{border-left:3px solid #ff6b6b}
  .info{border-left:3px solid #4dabf7}
  .detail{color:#9aa0a6;font-size:.82rem;display:block;margin-top:.15rem;
          word-break:break-word;font-family:ui-monospace,monospace}
  #verdict{margin-top:1.25rem;padding:1rem;border-radius:9px;font-weight:600;display:none}
  .allgood{background:#173a1f;color:#8ce99a}
  .nogood{background:#3a1717;color:#ffa8a8}
  code{background:#22262d;padding:.12rem .35rem;border-radius:4px;font-size:.85em}
</style>
</head>
<body>
<h1>🐙 Tentacalendar 2.0 — Foundation Smoke Test</h1>
<p class="sub">Proves config, sign-in, Firestore, and the 2.0 rules all work. Delete this page once the real app exists.</p>

<button id="go">Run the test (signs in with Google)</button>
<div id="out"></div>
<div id="verdict"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup }
  from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, getDocs, query, limit }
  from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// ============================================================
// PASTE YOUR NEW PROJECT'S CONFIG HERE (SETUP-2.0.md, Part 4).
// This is an IDENTIFIER, not a secret — it is safe in a public repo.
// ============================================================
const FIREBASE_CONFIG = {
  apiKey: "PASTE_ME",
  authDomain: "PASTE_ME",
  projectId: "PASTE_ME",
  storageBucket: "PASTE_ME",
  messagingSenderId: "PASTE_ME",
  appId: "PASTE_ME"
};

const out = document.getElementById("out");
const verdict = document.getElementById("verdict");
let failures = 0;

function log(state, msg, detail) {
  const row = document.createElement("div");
  row.className = "row " + state;
  const ico = state === "pass" ? "✅" : state === "fail" ? "❌" : "ℹ️";
  row.innerHTML = `<span class="ico">${ico}</span><span>${msg}${
    detail ? `<span class="detail">${String(detail).slice(0, 300)}</span>` : ""}</span>`;
  out.appendChild(row);
  if (state === "fail") failures++;
}

document.getElementById("go").onclick = async (e) => {
  e.target.disabled = true;
  out.innerHTML = ""; verdict.style.display = "none"; failures = 0;

  if (FIREBASE_CONFIG.apiKey === "PASTE_ME") {
    log("fail", "Config not filled in.", "Paste your firebaseConfig into smoke.html first — SETUP-2.0.md Part 4.");
    return finish();
  }

  let db, user, wsId;

  // ---- 1. Config loads ----
  try {
    const app = initializeApp(FIREBASE_CONFIG);
    db = getFirestore(app);
    log("pass", "Firebase initialised", FIREBASE_CONFIG.projectId);
  } catch (err) { log("fail", "Firebase failed to initialise", err.message); return finish(); }

  // ---- 2. Google sign-in ----
  try {
    const cred = await signInWithPopup(getAuth(), new GoogleAuthProvider());
    user = cred.user;
    log("pass", "Signed in with Google", user.email);
  } catch (err) {
    log("fail", "Sign-in failed", err.code + " — if this is auth/unauthorized-domain, add this hostname under Authentication → Settings → Authorized domains (SETUP-2.0.md Part 3).");
    return finish();
  }

  const me = (user.email || "").toLowerCase();

  // ---- 3. Own user profile ----
  try {
    await setDoc(doc(db, "users", me), { email: me, displayName: user.displayName || "", smokeTestAt: Date.now() }, { merge: true });
    log("pass", "Wrote your own user profile", `users/${me}`);
  } catch (err) { log("fail", "Could not write your user profile", err.message); return finish(); }

  // ---- 4. Create a workspace (the bootstrap sequence) ----
  wsId = "smoke_" + Math.random().toString(36).slice(2, 9);
  try {
    await setDoc(doc(db, "workspaces", wsId), {
      name: "Smoke Test", kind: "personal", ownerEmail: me,
      createdAt: Date.now(), createdBy: me, pollIntervalMinutes: 60, nextPollAt: null
    });
    log("pass", "Created a workspace", `workspaces/${wsId}`);
  } catch (err) { log("fail", "Could not create a workspace", err.message); return finish(); }

  // ---- 5. THE DEADLOCK TEST: first member document ----
  try {
    await setDoc(doc(db, "workspaces", wsId, "members", me), {
      email: me, role: "owner", addedBy: me, addedAt: Date.now(),
      displayName: user.displayName || "", hidden: false
    });
    log("pass", "Created the FIRST member document", "this is the bootstrap fix — rules 0.x deadlocked here");
  } catch (err) {
    log("fail", "Bootstrap deadlock — first member doc rejected", err.message + " → the published rules are probably the design doc's §5 sketch, not firestore-2.0.rules 1.0.0.");
    return finish();
  }

  // ---- 6. Data round-trip through a real subcollection ----
  try {
    await setDoc(doc(db, "workspaces", wsId, "tasks", "t1"), {
      title: "Prove the foundation works", tierId: null, dueAt: Date.now(),
      completedAt: null, completedBy: null, createdBy: me, createdAt: Date.now()
    });
    const back = await getDoc(doc(db, "workspaces", wsId, "tasks", "t1"));
    if (back.exists() && back.data().title) log("pass", "Wrote and read back a task", back.data().title);
    else log("fail", "Task write succeeded but read came back empty");
  } catch (err) { log("fail", "Task round-trip failed", err.message); }

  // ---- 7. THE IMPORTANT ONE: rules must DENY ----
  try {
    await getDocs(query(collection(db, "workspaces", "definitely_not_yours_" + Math.random().toString(36).slice(2, 8), "tasks"), limit(1)));
    log("fail", "SECURITY: read a workspace you are not a member of", "Rules are too permissive. Do NOT proceed until this line says PASS. Check that you published firestore-2.0.rules and not 'test mode'.");
  } catch (err) {
    if ((err.code || "").includes("permission-denied")) log("pass", "Rules correctly DENIED a foreign workspace", "isolation by path is working");
    else log("fail", "Unexpected error on the denial test", err.message);
  }

  // ---- 8. Clean up after ourselves ----
  try {
    await deleteDoc(doc(db, "workspaces", wsId, "tasks", "t1"));
    await deleteDoc(doc(db, "workspaces", wsId, "members", me));
    await deleteDoc(doc(db, "workspaces", wsId));
    log("info", "Cleaned up the smoke-test workspace", "your user profile is left in place; that's fine");
  } catch (err) { log("info", "Cleanup incomplete — harmless", "delete workspaces/" + wsId + " by hand if it bothers you"); }

  finish();
};

function finish() {
  verdict.style.display = "block";
  if (failures === 0) {
    verdict.className = "allgood";
    verdict.innerHTML = "🎉 <b>Foundation is solid.</b> Config, sign-in, Firestore, and the 2.0 rules all work — including denial. Send the config block to the next session and building can start.";
  } else {
    verdict.className = "nogood";
    verdict.innerHTML = `⚠️ <b>${failures} check${failures > 1 ? "s" : ""} failed.</b> Fix these before writing any app code — every one of them is a foundation problem that would otherwise show up later disguised as a bug in something else.`;
  }
  document.getElementById("go").disabled = false;
}
</script>
</body>
</html>
